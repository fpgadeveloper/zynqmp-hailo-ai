# U-Boot driver for the PL AXI IIC (as in the PetaLinux BSP's u-boot bsp.cfg).
# The Si5324 that supplies the PCIe reference clock sits on hdmi_axi_iic, which
# the boot script programs with "i2c" commands (u-boot-edf-scr_1.0.bbappend);
# the EDF u-boot config only has the PS I2C (Cadence) driver.
CONFIG_CMD_I2C=y
CONFIG_SYS_I2C_XILINX_XIIC=y
